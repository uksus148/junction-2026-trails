spring.application.name=trails-api
spring.config.import=optional:file:../.env[.properties]
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:trails}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:trails}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:}}
spring.mvc.problemdetails.enabled=true
api.cors.allowed-origins=${API_CORS_ALLOWED_ORIGINS:http://localhost:5173}

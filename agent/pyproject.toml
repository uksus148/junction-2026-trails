[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gopstop-agent"
version = "0.1.0"
description = "FastAPI chat service for GOPSTOP.PROTOCOL"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "redis>=5.2,<7.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
test = [
    "fakeredis[lua]>=2.26,<3.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
